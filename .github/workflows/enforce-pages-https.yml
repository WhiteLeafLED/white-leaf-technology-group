name: Enforce Pages HTTPS
on:
  push:
    paths:
      - .github/workflows/enforce-pages-https.yml
permissions:
  pages: write
jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce HTTPS for www.whiteleafled.net
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f cname="www.whiteleafled.net" \
            -F https_enforced=true
